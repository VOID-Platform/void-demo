name: Build & Publish Docker Image

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: void-hq/void-demo

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: void-demo

      - name: Checkout void-sdk
        uses: actions/checkout@v4
        with:
          repository: void-hq/void-sdk
          path: void-sdk

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: docker build -f void-demo/Dockerfile -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest .

      - name: Smoke test
        run: |
          docker run -d --name test-demo \
            -p 3000:3000 \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          sleep 5
          curl -f http://localhost:3000/ || exit 1
          docker stop test-demo

      - name: Push to GHCR
        if: github.event_name == 'push'
        run: docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

